<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>婚礼大作战</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0a10;
  font-family:system-ui,-apple-system,sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent;}
body{display:flex;align-items:center;justify-content:center;}

/* 舞台：填满全屏，保持 9:16，居中 */
#stage{
  position:relative;width:360px;height:640px;
  max-width:100dvw;max-height:100dvh;
  overflow:hidden;background:#000;
  box-shadow:0 0 60px rgba(200,0,30,.5);
}
@media(min-aspect-ratio:9/16){#stage{width:100dvw;height:calc(100dvw*1280/720);}}
@media(max-aspect-ratio:9/16){#stage{height:100dvh;width:calc(100dvh*720/1280);}}

/* 屏幕 */
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;overflow:hidden;}
.screen.active{display:block;}
video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;
  background:#000;pointer-events:none;}

/* 游戏 canvas：永远不在 .screen 内，仅被 JS 控制显示 */
#gameCanvas{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:none;pointer-events:none;z-index:2;
}
#gameCanvas.active{display:block;}

/* 透明交互按钮 */
.win-btn{position:absolute;background:transparent;border:none;cursor:pointer;z-index:5;
  -webkit-tap-highlight-color:transparent;}

/* 加载页 */
#loading{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:50;background:linear-gradient(160deg,#3f0a12,#70152a);
  color:#fff;
}
.ld-heart{width:60px;filter:drop-shadow(0 0 12px rgba(255,77,109,.9));
  animation:ldbeat 1.1s ease-in-out infinite;}
@keyframes ldbeat{0%,100%{transform:scale(1);}22%{transform:scale(1.14);}78%{transform:scale(1);}}
.ld-title{margin-top:16px;font-size:32px;font-weight:800;letter-spacing:6px;
  color:#ffe9c4;text-shadow:0 2px 12px rgba(0,0,0,.45);}
.ld-sub{margin-top:8px;font-size:14px;color:rgba(255,232,205,.85);letter-spacing:2px;}
.ld-track{margin-top:28px;width:260px;height:11px;background:rgba(255,255,255,.12);
  border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.2);}
.ld-bar{width:0%;height:100%;border-radius:8px;
  background:linear-gradient(90deg,#ff8fa3,#ff4d6d,#ff2d55);
  box-shadow:0 0 14px rgba(255,77,109,.9);transition:width .4s ease-out;}
.ld-tip{margin-top:12px;font-size:14px;color:rgba(255,255,255,.9);}
.ld-float{position:absolute;bottom:-50px;opacity:0;
  animation:ldfloat linear infinite;}
@keyframes ldfloat{
  0%{transform:translateY(0) scale(var(--s,1)) rotate(0deg);opacity:0;}
  10%{opacity:.7;}90%{opacity:.5;}
  100%{transform:translateY(-700px) scale(var(--s,1)) rotate(360deg);opacity:0;}}

/* 游戏结束弹层：挂 body 级 fixed，全屏遮盖一切 */
#gameOverLayer{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.92);z-index:200;
  flex-direction:column;align-items:center;justify-content:center;
  padding:16px;overflow-y:auto;
  font-family:system-ui,-apple-system,sans-serif;
}
#gameOverLayer.active{display:flex;}
#gameOverCard{
  background:linear-gradient(135deg,#c8001e,#8b0000);
  border:3px solid #FFD700;border-radius:18px;
  width:100%;max-width:648px;
  display:flex;flex-direction:column;align-items:center;
  padding:16px 0;gap:8px;
}
.go-title{font-size:28px;color:#FFD700;text-align:center;}
.go-sub{font-size:14px;color:rgba(255,255,255,.85);text-align:center;}
.go-score{font-size:56px;font-weight:bold;text-shadow:0 0 16px currentColor;margin:4px 0;}
.go-name-row{display:flex;gap:8px;width:88%;align-items:center;}
.go-name-input{
  flex:1;padding:12px;font-size:18px;border-radius:8px;
  border:2px solid #FFD700;text-align:center;background:#fff;color:#333;outline:none;
}
.go-submit{
  padding:12px 16px;font-size:18px;background:#FFD700;color:#8b0000;
  border:none;border-radius:8px;font-weight:bold;white-space:nowrap;
}
.go-lb-title{font-size:18px;color:#FFD700;}
.go-lb-rows{
  width:88%;max-height:160px;overflow-y:auto;font-size:14px;text-align:left;
  background:rgba(0,0,0,.25);border-radius:8px;padding:8px;line-height:1.6;
}
.go-btn-row{display:flex;flex-direction:column;gap:8px;width:88%;}
.go-btn-full{
  width:100%;padding:16px;font-size:22px;font-weight:bold;border-radius:12px;
  cursor:pointer;border:none;text-align:center;
}
.go-btn-row2{display:flex;gap:8px;width:88%;}
.go-btn-half{
  flex:1;padding:14px;font-size:18px;font-weight:bold;border-radius:12px;
  cursor:pointer;border:none;text-align:center;
  background:rgba(255,255,255,.1);color:#FFD700;border:2px solid #FFD700;
}
#goJoinBtn2{background:#FFD700;color:#8b0000;border:none;}

/* 排行榜弹层 */
#lbModal2{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.95);z-index:300;
  flex-direction:column;align-items:center;justify-content:flex-start;
  padding:24px 16px;overflow-y:auto;
}
#lbModal2.active{display:flex;}
.lb2-title{font-size:28px;color:#FFD700;margin-bottom:12px;}
.lb2-list{
  width:100%;max-width:648px;max-height:70vh;overflow-y:auto;
  background:rgba(200,0,30,.15);border:3px solid #FFD700;border-radius:12px;
  padding:12px;font-size:15px;line-height:1.7;
}
.lb2-row{display:flex;align-items:center;padding:6px 8px;border-radius:6px;margin-bottom:4px;}
.lb2-medal{width:32px;text-align:center;font-size:20px;}
.lb2-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px;}
.lb2-score{font-weight:bold;}
.lb2-close{
  margin-top:12px;padding:12px 32px;font-size:20px;background:#FFD700;color:#8b0000;
  border:none;border-radius:8px;font-weight:bold;cursor:pointer;
}
</style>
</head>
<body>

<!-- 舞台 -->
<div id="stage">

  <!-- 开始 -->
  <div id="start" class="screen">
    <video id="vStart" preload="none" loop muted playsinline webkit-playsinline
           x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false"
           poster="assets/poster_start.jpg?t=1791000000"></video>
    <button id="startArea" class="win-btn"></button>
  </div>

  <!-- 选角色 -->
  <div id="select" class="screen">
    <video id="vSelect" preload="none" loop muted playsinline webkit-playsinline
           x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false"
           poster="assets/poster_select.jpg?t=1791000000"></video>
    <button id="groomBtn" class="win-btn"></button>
    <button id="brideBtn" class="win-btn"></button>
  </div>

  <!-- 规则 -->
  <div id="rules" class="screen">
    <video id="vRules" preload="none" muted playsinline webkit-playsinline
           x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false"
           poster="assets/poster_rules.jpg?t=1791000000"></video>
    <button id="rulesBtn" class="win-btn"></button>
  </div>

  <!-- 游戏 -->
  <div id="game" class="screen">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- 地图 -->
  <div id="map" class="screen">
    <video id="vMap" preload="none" loop muted playsinline webkit-playsinline
           x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false"
           poster="assets/poster_map.jpg?t=1791000000"></video>
    <button id="mapArea" class="win-btn"></button>
    <button id="joinBtn" class="win-btn"></button>
  </div>

  <!-- 感谢 -->
  <div id="thanks" class="screen">
    <video id="vThanks" preload="none" loop muted playsinline webkit-playsinline
           x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false"
           poster="assets/poster_thanks.jpg?t=1791000000"></video>
  </div>

</div><!-- #stage -->

<!-- 游戏结束弹层 -->
<div id="gameOverLayer">
  <div id="gameOverCard">
    <div class="go-title" id="goTitle2">收到请柬！</div>
    <div class="go-sub"  id="goSub2">婚礼请柬已送达！</div>
    <div class="go-score" id="goScore2" style="color:#00FF88">0 分</div>
    <div class="go-name-row">
      <input class="go-name-input" id="goNameInput2" type="text" placeholder="输入名字上榜(可选)" maxlength="8" />
      <button class="go-submit" id="goSubmit2">上传</button>
    </div>
    <div class="go-lb-title">&#x1F3C6; 前十排行榜</div>
    <div class="go-lb-rows" id="goLbRows2"></div>
    <div class="go-btn-row">
      <button class="go-btn-full" id="goJoinBtn2">&#x2764; 参与婚礼</button>
      <div class="go-btn-row2">
        <button class="go-btn-half" id="goReplayBtn2">&#x1F504; 再玩一次</button>
        <button class="go-btn-half" id="goLbBtn2">&#x1F3C6; 排行榜</button>
      </div>
    </div>
  </div>
</div>

<!-- 排行榜弹层 -->
<div id="lbModal2">
  <div class="lb2-title">&#x1F3C6; 完整排行榜</div>
  <div class="lb2-list" id="lb2List"></div>
  <button class="lb2-close" id="lb2Close">关闭</button>
</div>

<script>
(function(){
'use strict';
// ══════════════════════════════════════════════════════════
//  常量
// ══════════════════════════════════════════════════════════
var LOGIC_W = 720, LOGIC_H = 1280;
var CHAR_W  = 150, CHAR_H  = Math.round(150 * 480 / 345);
var GROUND_Y= LOGIC_H - 110;
var CHAR_SPD= 420;

// ══════════════════════════════════════════════════════════
//  素材 URL
// ══════════════════════════════════════════════════════════
var URLS = {
  bg:        'assets/img_0_hd.jpg?t=1791000000',
  groom:     'assets/groom.webp?t=1791000000',
  bride:     'assets/bride.webp?t=1791000000',
  heartRed:  'assets/img_1_hd.webp?t=1791000000',
  heartYel:  'assets/img_2_hd.webp?t=1791000000',
  ring:      'assets/ring_hd.webp?t=1791000000',
  letter:    'assets/letter_hd.webp?t=1791000000',
  bgm:       'assets/bgm_v2.mp3?t=1791000000',
  btn:       'assets/btn.mp3?t=1791000000',
  cat:       'assets/catch.mp3?t=1791000000',
  startV:    'assets/start_v2.mp4?t=1791000000',
  selectV:   'assets/select_v2.mp4?t=1791000000',
  rulesV:    'assets/rules.mp4?t=1791000000',
  mapV:      'assets/map_v2.mp4?t=1791000000',
  thanksV:   'assets/thanks_v2.mp4?t=1791000000',
};

// ══════════════════════════════════════════════════════════
//  游戏状态
// ══════════════════════════════════════════════════════════
var game = {
  canvas:null, ctx:null, running:false,
  _raf:null, lastT:0,
  score:0, hearts:[], charX:LOGIC_W/2, charDir:1,
  moving:false, bob:0, frame:0, ftimer:0,
  spawnT:0.3,
};
var charImg = null;   // 当前角色 Image

// ══════════════════════════════════════════════════════════
//  图片缓存
// ══════════════════════════════════════════════════════════
var RES = {};

// ══════════════════════════════════════════════════════════
//  音频单例
// ══════════════════════════════════════════════════════════
var _bgm=null, _btnAud=null, _catAud=null;
function playBgm(){
  if(_bgm) return;
  _bgm = new Audio(); _bgm.loop = true; _bgm.volume = 0.25;
  _bgm.src = URLS.bgm; _bgm.play().catch(function(){});
}
function playBtn(){
  if(!_btnAud){ _btnAud = new Audio(URLS.btn); _btnAud.volume = 0.4; }
  try{ _btnAud.currentTime = 0; }catch(e){}
  _btnAud.play().catch(function(){});
}
function playCat(){
  if(!_catAud){ _catAud = new Audio(URLS.cat); _catAud.volume = 0.4; }
  try{ _catAud.currentTime = 0; }catch(e){}
  _catAud.play().catch(function(){});
}

// ══════════════════════════════════════════════════════════
//  图片加载
// ══════════════════════════════════════════════════════════
function loadImg(src){
  return new Promise(function(res){
    var i = new Image();
    i.onload = function(){ res(i); };
    i.onerror = function(){ res(null); };
    i.src = src;
  });
}

// ══════════════════════════════════════════════════════════
//  视频控制
// ══════════════════════════════════════════════════════════
function pauseAll(){
  ['vStart','vSelect','vRules','vMap','vThanks'].forEach(function(id){
    var v = document.getElementById(id);
    if(v) v.pause();
  });
}
function playOne(id, src){
  var v = document.getElementById(id);
  if(!v) return;
  pauseAll();
  if(v.src && v.src.indexOf(src) >= 0){ v.play().catch(function(){}); return; }
  v.src = src; v.load();
  v.oncanplay = function(){ v.play().catch(function(){}); v.oncanplay = null; };
}

// ══════════════════════════════════════════════════════════
//  屏幕切换
// ══════════════════════════════════════════════════════════
function showScreen(name){
  // 1. 停止游戏循环
  if(game._raf){ cancelAnimationFrame(game._raf); game._raf = null; }
  game.running = false;

  // 2. 立即隐藏 canvas
  var gc = document.getElementById('gameCanvas');
  if(gc){ gc.style.display = 'none'; gc.classList.remove('active'); }
  if(game.ctx) game.ctx.clearRect(0,0,LOGIC_W,LOGIC_H);

  // 3. 切 .screen active
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  var t = document.getElementById(name);
  if(t) t.classList.add('active');

  // 4. 停所有视频
  pauseAll();

  // 5. 播当前屏视频（懒加载，只有切到该屏才加载）
  if(name === 'start')  playOne('vStart',  URLS.startV);
  if(name === 'select') playOne('vSelect', URLS.selectV);
  if(name === 'rules')  playOne('vRules',  URLS.rulesV);
  if(name === 'map'){
    playOne('vMap', URLS.mapV);
    // 预热感谢视频（不播，只 load）
    var vt = document.getElementById('vThanks');
    if(vt && (!vt.src || vt.src.indexOf(URLS.thanksV)<0)){
      vt.src = URLS.thanksV; vt.load();
    }
  }
  if(name === 'thanks'){
    var vt2 = document.getElementById('vThanks');
    if(vt2 && vt2.src) vt2.play().catch(function(){});
  }

  // 6. 游戏屏
  if(name === 'game'){
    if(gc){ gc.style.display = 'block'; gc.classList.add('active'); }
    startGame();
  }
}

// ══════════════════════════════════════════════════════════
//  canvas 初始化
// ══════════════════════════════════════════════════════════
function resizeCanvas(){
  var cvs = game.canvas, ctx = game.ctx;
  var stage = document.getElementById('stage');
  var rect = stage.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width  = Math.round(rect.width  * dpr);
  cvs.height = Math.round(rect.height * dpr);
  var sx = cvs.width  / LOGIC_W;
  var sy = cvs.height / LOGIC_H;
  ctx.setTransform(sx, 0, 0, sy, 0, 0);
  ctx.imageSmoothingEnabled = false;
}

// ══════════════════════════════════════════════════════════
//  游戏主循环
// ══════════════════════════════════════════════════════════
function loop(now){
  game._raf = requestAnimationFrame(loop);
  if(!game.running) return;
  var dt = Math.min((now - game.lastT) / 1000, 0.05);
  game.lastT = now;
  update(dt);
  render();
}

function startGame(){
  var cvs = document.getElementById('gameCanvas');
  game.canvas = cvs;
  game.ctx    = cvs.getContext('2d');
  resizeCanvas();
  game.running  = true;
  game.score    = 0;
  game.hearts   = [];
  game.charX    = LOGIC_W / 2;
  game.charDir  = 1;
  game.moving   = false;
  game.bob      = 0;
  game.frame    = 0;
  game.ftimer   = 0;
  game.spawnT   = 0.3;
  game.lastT    = performance.now();
  if(!game._raf) game._raf = requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════════════════
//  update
// ══════════════════════════════════════════════════════════
function checkCol(h){
  var dx = h.x - game.charX, dy = h.y - (GROUND_Y - CHAR_H/2);
  return (dx*dx + dy*dy) < ((CHAR_W/2 + h.r2) * (CHAR_W/2 + h.r2));
}

function doGameOver(reason){
  game.running = false;
  if(game._raf){ cancelAnimationFrame(game._raf); game._raf = null; }
  if(game.ctx) game.ctx.clearRect(0,0,LOGIC_W,LOGIC_H);
  var gc = document.getElementById('gameCanvas');
  if(gc){ gc.style.display='none'; gc.classList.remove('active'); }
  showGameOver(reason);
}

function update(dt){
  // 角色移动
  if(game.moving){
    game.charX += game.charDir * CHAR_SPD * dt;
    if(game.charX < CHAR_W/2)  game.charX = CHAR_W/2;
    if(game.charX > LOGIC_W - CHAR_W/2) game.charX = LOGIC_W - CHAR_W/2;
  }
  game.bob += dt * 3.2;
  game.ftimer += dt;
  if(game.ftimer > 0.12){ game.ftimer = 0; game.frame = (game.frame+1)%8; }

  // 生成爱心
  game.spawnT -= dt;
  if(game.spawnT <= 0){
    game.spawnT = 0.5 + Math.random()*0.8;
    var r = Math.random(), type, hw, hh, r2;
    if(r < 0.267)     {type='red';   hw=52;hh=52;r2=48;}
    else if(r < 0.717){type='yellow';hw=52;hh=52;r2=48;}
    else if(r < 0.797){type='ring';  hw=80;hh=44;r2=40;}
    else              {type='letter';hw=136;hh=77;r2=64;}
    var spd = ((type==='letter'||type==='yellow') ? 420 : 240) + Math.random()*160;
    spd *= Math.pow(1.2, Math.floor(game.score/500));
    game.hearts.push({
      type:type, x:hw+Math.random()*(LOGIC_W-2*hw),
      y:-hh, vy:spd, r2:r2, hw:hw, hh:hh
    });
  }

  // 移动 & 碰撞
  for(var i=game.hearts.length-1; i>=0; i--){
    var h = game.hearts[i];
    h.y += h.vy * dt;
    if(checkCol(h)){
      game.hearts.splice(i,1);
      if(h.type==='red')   { game.score+=10; playCat(); }
      else if(h.type==='yellow'){ game.score-=20; if(game.score<0) game.score=0; playCat(); }
      else if(h.type==='ring')  { game.score+=50; playCat(); }
      else { doGameOver('letter'); return; }
      if(game.score < 0){ doGameOver('neg'); return; }
    } else if(h.y > LOGIC_H+80){
      game.hearts.splice(i,1);
    }
  }
}

// ══════════════════════════════════════════════════════════
//  render
// ══════════════════════════════════════════════════════════
function render(){
  var ctx = game.ctx;
  // 背景
  ctx.imageSmoothingEnabled = true;
  if(RES.bg){ ctx.drawImage(RES.bg, 0, 0, LOGIC_W, LOGIC_H); }
  else {
    var g = ctx.createLinearGradient(0,0,0,LOGIC_H);
    g.addColorStop(0,'#fce4ec'); g.addColorStop(1,'#f8bbd0');
    ctx.fillStyle = g; ctx.fillRect(0,0,LOGIC_W,LOGIC_H);
  }
  ctx.imageSmoothingEnabled = false;

  // 爱心
  for(var i=0;i<game.hearts.length;i++){
    var h = game.hearts[i];
    var img = h.type==='red' ? RES.heartRed : h.type==='yellow' ? RES.heartYel
            : h.type==='ring' ? RES.ring : RES.letter;
    if(img) ctx.drawImage(img, h.x-h.hw, h.y-h.hh, h.hw*2, h.hh*2);
  }

  // 角色
  if(charImg && charImg.complete && charImg.naturalWidth>0){
    var cw = charImg.naturalWidth, ch2 = charImg.naturalHeight;
    var fw = cw/8, fh = ch2;
    var sx = game.frame * fw;
    var dw = CHAR_W, dh = CHAR_H;
    var dx = game.charX - dw/2;
    var dy = GROUND_Y - dh + Math.sin(game.bob)*4;
    ctx.save();
    if(game.charDir < 0){
      ctx.translate(game.charX*2, 0);
      ctx.scale(-1,1);
      dx = -game.charX - dw/2;
    }
    ctx.drawImage(charImg, sx, 0, fw, fh, dx, dy, dw, dh);
    ctx.restore();
  }

  // HUD
  ctx.imageSmoothingEnabled = true;
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  roundRect(ctx,12,12,180,54,12); ctx.fill();
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('\u2764 ' + game.score, 26, 52);
  ctx.imageSmoothingEnabled = false;
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function mask(n){ if(!n)return''; return n[0]+'*'.repeat(Math.max(0,n.length-1)); }
function medal(k){ return k===0?'\u{1F947}':k===1?'\u{1F948}':k===2?'\u{1F949}':('<b>'+(k+1)+'</b>'); }
function rowHtml(k,row,alt){
  var mc = k===0?'#FFD700':k===1?'#C0C0C0':k===2?'#CD7F32':'#fff';
  return '<div style="display:flex;align-items:center;padding:6px 8px;border-radius:6px;margin-bottom:4px;background:'+(alt?'rgba(255,255,255,.06)':'rgba(0,0,0,.15)')+';">'+
    '<div style="width:32px;text-align:center;font-size:20px;color:'+mc+';">'+medal(k)+'</div>'+
    '<div style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:'+mc+';font-size:14px;padding:0 8px;">'+mask(row.n)+'</div>'+
    '<div style="color:'+mc+';font-size:14px;font-weight:bold;">'+row.s+'</div></div>';
}

function fetchLB(){
  var el = document.getElementById('goLbRows2');
  if(!el) return;
  var sorted = FAKE.slice().sort(function(a,b){return b.s-a.s;});
  var html = '';
  for(var k=0;k<sorted.length;k++) html += rowHtml(k, sorted[k], k%2===0);
  el.innerHTML = html || '<div style="color:#FFD700;text-align:center;padding:12px;">暂无数据</div>';
}

function submitScore(name, score){
  var x = new XMLHttpRequest();
  x.open('POST','https://api.github.com/repos/guanqicong/guanqicong.github.io/issues',true);
  x.setRequestHeader('Accept','application/vnd.github+json');
  x.setRequestHeader('Authorization','Bearer '+LBTOK);
  x.setRequestHeader('Content-Type','application/json');
  x.onload = function(){ alert(x.status===200||x.status===201?'上榜成功！':'上传失败('+x.status+')'); fetchLB(); };
  x.onerror = function(){ alert('网络错误'); };
  x.send(JSON.stringify({title:'[LB] '+name+' '+score, body:'得分上榜：'+name+' = '+score+' \u5206'}));
}

// ══════════════════════════════════════════════════════════
//  事件绑定
// ══════════════════════════════════════════════════════════
function bindEvents(){
  // 微信视频解锁
  function unlock(){ ['vStart','vSelect','vRules','vMap','vThanks'].forEach(function(id){
    var v = document.getElementById(id);
    if(v && v.src && v.paused) v.play().catch(function(){});
  });}
  document.addEventListener('touchstart', unlock, {passive:true});
  document.addEventListener('click',      unlock, {passive:true});

  // 开始
  var sa = document.getElementById('startArea');
  sa.style.cssText = 'left:29%;right:29%;top:88%;height:8%;';
  sa.addEventListener('click',     function(e){ e.stopPropagation(); playBtn(); showScreen('select'); });
  sa.addEventListener('touchstart',function(e){ e.preventDefault(); e.stopPropagation(); playBtn(); showScreen('select'); },{passive:false});

  // 角色
  var gb = document.getElementById('groomBtn');
  gb.style.cssText = 'left:6%;top:36%;width:42%;height:44%;';
  gb.addEventListener('click',     function(e){ e.stopPropagation(); charImg=RES.groom; playBtn(); showScreen('rules'); });
  gb.addEventListener('touchstart',function(e){ e.preventDefault(); e.stopPropagation(); charImg=RES.groom; playBtn(); showScreen('rules'); },{passive:false});

  var bb = document.getElementById('brideBtn');
  bb.style.cssText = 'left:52%;top:36%;width:42%;height:44%;';
  bb.addEventListener('click',     function(e){ e.stopPropagation(); charImg=RES.bride; playBtn(); showScreen('rules'); });
  bb.addEventListener('touchstart',function(e){ e.preventDefault(); e.stopPropagation(); charImg=RES.bride; playBtn(); showScreen('rules'); },{passive:false});

  // 规则页
  var rb = document.getElementById('rulesBtn');
  rb.style.cssText = 'left:25%;right:25%;bottom:5%;height:18%;';
  rb.addEventListener('click',     function(e){ e.stopPropagation(); playBtn(); showScreen('game'); });
  rb.addEventListener('touchstart',function(e){ e.preventDefault(); e.stopPropagation(); playBtn(); showScreen('game'); },{passive:false});

  // 游戏触控
  var gameDiv = document.getElementById('game');
  function onDown(e){ e.preventDefault(); game.moving = true; updateDir(e); }
  function onMove(e){ e.preventDefault(); if(game.moving) updateDir(e); }
  function onUp(){ game.moving = false; }
  function updateDir(e){
    var stage = document.getElementById('stage');
    var rect = stage.getBoundingClientRect();
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    game.charDir = cx < rect.left + rect.width/2 ? -1 : 1;
  }
  gameDiv.addEventListener('touchstart', onDown, {passive:false});
  gameDiv.addEventListener('touchmove',  onMove, {passive:false});
  gameDiv.addEventListener('touchend',   onUp);
  gameDiv.addEventListener('touchcancel',onUp);
  gameDiv.addEventListener('mousedown',  onDown);
  window.addEventListener('mousemove',   function(e){ if(game.moving) updateDir(e); });
  window.addEventListener('mouseup',     onUp);

  // 地图
  var ma = document.getElementById('mapArea');
  ma.style.cssText = 'left:14%;width:72%;top:50%;height:26%;';
  ma.addEventListener('click',     function(e){ e.stopPropagation(); openMap(); });
  ma.addEventListener('touchstart',function(e){ e.preventDefault(); e.stopPropagation(); openMap(); },{passive:false});

  var jb = document.getElementById('joinBtn');
  jb.style.cssText = 'left:32%;width:36%;top:86%;height:12%;';
  jb.addEventListener('click',     function(e){ e.stopPropagation(); playBtn(); showScreen('thanks'); });
  jb.addEventListener('touchstart',function(e){ e.preventDefault(); e.stopPropagation(); playBtn(); showScreen('thanks'); },{passive:false});

  // 游戏结束弹层按钮
  document.getElementById('goJoinBtn2').addEventListener('click', function(e){
    e.stopPropagation(); playBtn();
    hideGameOver(); showScreen('map');
  });
  document.getElementById('goReplayBtn2').addEventListener('click', function(e){
    e.stopPropagation(); playBtn();
    hideGameOver(); showScreen('select');
  });
  document.getElementById('goLbBtn2').addEventListener('click', function(e){
    e.stopPropagation(); playBtn(); showLeaderModal();
  });
  document.getElementById('goSubmit2').addEventListener('click', function(e){
    e.stopPropagation(); playBtn();
    var name = document.getElementById('goNameInput2').value.trim();
    if(!name){ alert('请输入名字！'); return; }
    submitScore(name, game.score);
  });
  document.getElementById('lb2Close').addEventListener('click', function(e){
    e.stopPropagation();
    document.getElementById('lbModal2').classList.remove('active');
  });

  // resize
  window.addEventListener('resize', function(){
    if(game.canvas) resizeCanvas();
  });
}

// ══════════════════════════════════════════════════════════
//  加载流程
// ══════════════════════════════════════════════════════════
function setBar(p){
  var el = document.getElementById('loadBar');
  if(el) el.style.width = Math.max(0,Math.min(100,p))+'%';
}
function setTip(t){ var el = document.getElementById('loadTip'); if(el) el.textContent = t; }

setTip('加载素材…');
setBar(5);

Promise.all([
  loadImg(URLS.groom),
  loadImg(URLS.bride),
  loadImg(URLS.heartRed),
  loadImg(URLS.heartYel),
  loadImg(URLS.ring),
  loadImg(URLS.letter),
]).then(function(results){
  RES.groom    = results[0];
  RES.bride    = results[1];
  RES.heartRed = results[2];
  RES.heartYel = results[3];
  RES.ring     = results[4];
  RES.letter   = results[5];
  setBar(60);
  setTip('加载背景…');
  // 背景 XHR 加载（解决跨域 drawImage 问题）
  var x = new XMLHttpRequest();
  x.open('GET', URLS.bg, true);
  x.responseType = 'blob';
  x.onload = function(){
    if(x.status===200){
      var url = URL.createObjectURL(x.response);
      var i = new Image();
      i.onload = function(){ RES.bg=i; finish(); };
      i.onerror = function(){ finish(); };
      i.src = url;
    } else { finish(); }
  };
  x.onerror = function(){ finish(); };
  x.send();
  function finish(){
    setBar(90);
    setTip('完成！');
    setTimeout(function(){
      var l = document.getElementById('loading');
      if(l) l.style.display = 'none';
      bindEvents();
      playBgm();
      showScreen('start');
      setBar(100);
    }, 500);
  }
}).catch(function(){
  var l = document.getElementById('loading');
  if(l) l.style.display = 'none';
  bindEvents(); playBgm(); showScreen('start');
});

// 15秒超时兜底
setTimeout(function(){
  var l = document.getElementById('loading');
  if(l && l.style.display !== 'none'){
    l.style.display = 'none';
    try{ bindEvents(); playBgm(); showScreen('start'); } catch(e){}
  }
}, 15000);

})();
