<script>
/* BGM 自动播放引擎（最早执行）：打开链接即尝试播放，微信 JSBridge 就绪立即播放 */
(function(){
  if (window.__bgm) return;
  var bgm = {
    audio: null, playing: false, tries: 0, started: false,
    ensure: function(){
      if (!this.audio) {
        try {
          this.audio = new Audio("assets/bgm_v2.mp3?t=1788801000");
          this.audio.loop = true;
          this.audio.volume = 0.5;
          this.audio.preload = "auto";
        } catch(e) { return null; }
      }
      return this.audio;
    },
    play: function(){
      if (this.playing && this.audio && !this.audio.paused) return true;
      var a = this.ensure();
      if (!a) return false;
      try {
        var p = a.play();
        if (p && p.then) {
          p.then(function(){ bgm.playing = true; }).catch(function(){ bgm.playing = false; });
        } else {
          this.playing = true;
        }
      } catch(e) { return false; }
      return this.playing;
    },
    stop: function(){ if (this.audio) { this.audio.pause(); this.playing = false; } },
    setVolume: function(v){ if (this.audio) this.audio.volume = v; },
    start: function(){
      var self = this;
      if (this.started) return;
      this.started = true;
      // 1. 立即尝试
      this.play();
      // 2. 微信 JSBridge 就绪事件（最早挂，防错过）
      if (window.WeixinJSBridge && window.WeixinJSBridge.invoke) { this.play(); }
      if (document.addEventListener) {
        document.addEventListener("WeixinJSBridgeReady", function wxb(){
          self.play();
          document.removeEventListener("WeixinJSBridgeReady", wxb);
        }, false);
      }
      // 3. 轮询 WeixinJSBridge 出现（防事件未派发）
      var poll = 0;
      var iv1 = setInterval(function(){
        poll++;
        if (window.WeixinJSBridge && window.WeixinJSBridge.invoke) { self.play(); clearInterval(iv1); }
        else if (poll >= 15) { clearInterval(iv1); }
      }, 200);
      // 4. 500ms 重试，最长约 6 秒
      var retry = 0;
      var iv2 = setInterval(function(){
        retry++;
        if (self.playing) { clearInterval(iv2); return; }
        if (retry >= 12) { clearInterval(iv2); return; }
        self.play();
      }, 500);
    }
  };
  window.__bgm = bgm;
  bgm.start();
  // 首次用户手势兜底（浏览器硬限制下的最后保障）
  function once(){ window.__bgm.play(); }
  if (document.addEventListener) {
    ["touchstart","click","keydown"].forEach(function(ev){
      document.addEventListener(ev, once, {once:true, passive:true});
    });
  }
})();
</script>

  // ===== 音频系统 =====
  // BGM 由 head 中的 window.__bgm 引擎管理：打开链接即自动尝试播放，微信 JSBridge 就绪立即播放
  // 音效仅两个且均为单例：爱心音效（红黄通用）、按键音。同一个实例播放前归零，杜绝叠加。
  let btnAudio = null;
  let catchAudio = null;

  function playBgm()   { if (window.__bgm) window.__bgm.play(); }
  function stopBgm()   { if (window.__bgm) window.__bgm.stop(); }
  function tryAutoBgm(){ if (window.__bgm) window.__bgm.play(); }

  // 音效单例播放：复用同一实例，先重置到开头再播，杜绝连点/重叠叠加
  function playSfx(kind) {
    let el = kind === "btn" ? btnAudio : catchAudio;
    if (!el) {
      el = new Audio(kind === "btn" ? ASSETS.btnSound : ASSETS.catchSound);
      el.volume = 0.8;
      el.preload = "auto";
      if (kind === "btn") btnAudio = el; else catchAudio = el;
    }
    // 首次创建时音频可能未就绪，currentTime 赋值在部分内核会抛异常，必须保护
    try { if (el.currentTime > 0.01) el.currentTime = 0; } catch(e) {}
    var p = el.play();
    if (p && p.catch) p.catch(function(){});
  }
  function playBtnSound()   { playSfx("btn"); }
  function playCatchSound() { playSfx("catch"); }

  const SHEET_COLS = 10, SHEET_ROWS = 2;
  const FRAME_COUNT = 14;
  const CELL_W = 345, CELL_H = 480;

  const CHAR_W = 195, CHAR_H = Math.round(CHAR_W * CELL_H / CELL_W);
  const GROUND_Y = LOGIC_H - 110;

  let char = null;
  const game = {
    canvas:null, ctx:null, scale:1,
    running:false, lastT:0, score:0, isNeg:false,
    hearts:[], spawnTimer:0,
    charX:LOGIC_W/2, charDir:1, moving:false, bob:0, frameIdx:0, frameTimer:0
  };

  const RES = {};

  function setProgress(done, total){
    var pct = Math.min(100, Math.round(done / total * 100));
    var tip = document.getElementById("loadTip");
    if(tip) tip.textContent = (done >= total) ? "准备入场…" : "加载中 " + pct + "%";
    var bar = document.getElementById("loadBar");
    if(bar) bar.style.width = pct + "%";
  }

  function loadImage(src){
    return new Promise((res)=>{
      const i=new Image();
      i.onload=()=>res(i);
      i.onerror=()=>{ console.warn("图片加载失败:", src); res(null); }; // 容错：失败也放行
      i.src=src;
    });
  }

  let loadedCount = 0;
  const TOTAL_IMG = 7;

  function init(){
    // 微信 X5 内核兼容
    document.querySelectorAll("video").forEach(v=>{
      v.setAttribute("x5-playsinline","");
      v.setAttribute("x5-video-player-type","h5");
      v.setAttribute("x5-video-player-fullscreen","false");
      v.setAttribute("webkit-playsinline","");
      v.setAttribute("playsinline","");
      v.muted = true;
    });

    // 预创建音效实例
    try {
      btnAudio = new Audio(ASSETS.btnSound); btnAudio.volume = 0.8; btnAudio.preload = "auto";
      catchAudio = new Audio(ASSETS.catchSound); catchAudio.volume = 0.8; catchAudio.preload = "auto";
    } catch(e) {}

    // 并行加载所有图片（Promise.all 同时下载，大幅加速）
    var promises = [
      loadImage(ASSETS.brideSheet).then(function(img){ RES["bride"] = img; }),
      loadImage(ASSETS.groomSheet).then(function(img){ RES["groom"] = img; }),
      loadImage(ASSETS.heartRed).then(function(img){ RES["hr"] = img; }),
      loadImage(ASSETS.heartYellow).then(function(img){ RES["hy"] = img; }),
      loadImage(ASSETS.ring).then(function(img){ RES["ring"] = img; }),
      loadImage(ASSETS.letter).then(function(img){ RES["letter"] = img; }),
      loadImage(ASSETS.bg).then(function(img){ RES["bg"] = img; })
    ];

    // 实时更新进度（任意一个完成就 +1）
    var done = 0;
    promises.forEach(function(p){
      p.then(function(){
        done++;
        loadedCount = done;
        setProgress(done, TOTAL_IMG);
      }).catch(function(){});
    });

    return Promise.all(promises).catch(function(){}).then(function(){ finishLoading(); });
  }

  function finishLoading(){
    var l = document.getElementById("loading");
    var go = function(){
      show("start");
      bindEvents();
      // BGM 自动播放已在脚本开头处理（立即尝试 + 微信 JSBridge + 首次手势兜底）

  }

  function ensureVideo(id, src){
    const v=document.getElementById(id);
    if(!v) return;
    v.muted = true;
    v.volume = 0;
    v.loop = true; // 画面循环播放
    if(!v.src || v.src.indexOf(src)<0){ v.src = src; }
    // 视频加载/解码失败兑底：保持 poster 静态画面可见（不黑屏）
    if(!v._boundErr){
      v._boundErr = true;
      v.addEventListener("error", function(){ try{ v.pause(); }catch(e){} });
    }
    // 数据就绪后再播一次（提升微信内播放成功率）；readyState 已够则直接播
    var tryPlay = function(){
      var pv = v.play();
      if (pv && pv.catch) pv.catch(function(){});
    };
    if (v.readyState >= 3) { tryPlay(); }
    else {
      var h1 = function(){ tryPlay(); v.removeEventListener("canplay", h1); };
      v.addEventListener("canplay", h1);
      tryPlay();
    }
  }

  function onDown(e){
    e.preventDefault();
    const rect = stage.getBoundingClientRect();
    const cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    const x = (cx - rect.left) / rect.width * LOGIC_W;
    game.moving = true;
    game.charDir = (x < game.charX) ? -1 : 1;
  }

  function onMove(e){
    if(!game.moving) return;
    const rect = stage.getBoundingClientRect();
    const cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    const x = (cx - rect.left) / rect.width * LOGIC_W;
    game.charDir = (x < game.charX) ? -1 : 1;
  }

  function onUp(){ game.moving = false; }

  function startGame(){

    game.charDir = 1;
    game.moving = false;
    game.bob = 0;

  function resizeCanvas(){
    const canvas = game.canvas, ctx = game.ctx;
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    game.scale = rect.width / LOGIC_W;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const sx = (rect.width * dpr) / LOGIC_W;
    const sy = (rect.height * dpr) / LOGIC_H;
    ctx.setTransform(sx, 0, 0, sy, 0, 0);
  }

  window.addEventListener("resize", ()=>{ if(game.canvas) resizeCanvas(); });

  function loop(now){
    game._raf = requestAnimationFrame(loop);
    const dt = Math.min((now - game.lastT) / 1000, 0.05);
    game.lastT = now;
    if(!game.running) return;
    update(dt);
    render();
  }

  function update(dt){
    // 角色移动
    const speed = 420;
    if(game.moving){
      game.charX += game.charDir * speed * dt;
      game.bob += dt * 12;
    } else {
      game.bob += dt * 3;
    }
    game.charX = Math.max(CHAR_W/2, Math.min(LOGIC_W - CHAR_W/2, game.charX));

    // 帧动画
    game.frameTimer += dt;
    if(game.frameTimer > 0.06){
      game.frameTimer = 0;
      game.frameIdx = (game.frameIdx + 1) % FRAME_COUNT;
    }

    // 生成爱心（数量多，红心从一开始就出现）
    game.spawnTimer -= dt;
    if(game.spawnTimer <= 0){
      spawnHeart();
      game.spawnTimer = 0.35 + Math.random() * 0.35;
    }

    // 更新爱心
    const catchTop = GROUND_Y - CHAR_H * 0.92;
    const catchBottom = GROUND_Y - CHAR_H * 0.25;
    const catchLeft = game.charX - CHAR_W * 0.42;
    const catchRight = game.charX + CHAR_W * 0.42;

    for(let i = game.hearts.length - 1; i >= 0; i--){
      const h = game.hearts[i];
      h.y += h.vy * dt;
      h.rot += h.vr * dt;

      if(!h.caught && h.y > catchTop && h.y < catchBottom && h.x > catchLeft && h.x < catchRight){
        h.caught = true;
        if(h.type === 'red'){
          // 红心 +10
          game.score += 10;
          game.hearts.splice(i, 1);
          playCatchSound();
        } else if(h.type === 'yellow'){
          // 黄心 -20
          game.score -= 20;
          game.hearts.splice(i, 1);
          playBtnSound("btn");
        } else if(h.type === 'ring'){
          // 戒指 +50
          game.score += 50;
          game.hearts.splice(i, 1);
          playCatchSound();
        } else if(h.type === 'letter'){
          // 请帖 = 游戏结束
          game.running = false;
          playBtnSound("btn");
          game.hearts.splice(i, 1);
          showGameOver("letter");
          return;
        }
        // 负分 → 游戏结束
        if(game.score < 0){
          game.isNeg = true;
          game.running = false;
          showGameOver("neg");
          return;
        }
        // 正分且不为零 → 继续
        if(game.score > 0){
          game.isNeg = false;
        }
        // 接住红心/戒指后加分 → 继续
      } else if(h.y > LOGIC_H + 80){
        game.hearts.splice(i, 1);
      }
    }
  }

  function spawnHeart(){
    // 概率：红心 26.7%，黄心 45%，戒指 8%，请帖 20.3%（黄心多=干扰多，难度加大）
    var rand = Math.random();
    var type;
    if(rand < 0.267){ type = 'red'; }
    else if(rand < 0.717){ type = 'yellow'; }
    else if(rand < 0.797){ type = 'ring'; }
    else { type = 'letter'; }

    var r, imgSrc;
    if(type === 'ring'){
      r = 80;
    } else if(type === 'letter'){
      r = 136;
    } else {
      r = type === 'red' ? (56 + Math.random() * 10) : (50 + Math.random() * 10);
    }
    game.hearts.push({
      x: 60 + Math.random() * (LOGIC_W - 120),
      y: -r - 10,
      vy: ((type === 'letter' ? 420 : 240) + Math.random() * 160) * ((type === 'yellow' || type === 'letter') ? Math.pow(1.2, Math.floor(game.score / 500)) : 1),
      r: r,
      hw: (type==='letter' ? 136 : type==='ring' ? 80 : r),
      hh: (type==='letter' ? 77 : type==='ring' ? 44 : r),
      type: type,
      rot: (Math.random() * 2 - 1) * 0.3,
      vr: (Math.random() * 2 - 1) * 0.6,
      caught: false
    });
  }

  function render(){
    const ctx = game.ctx;
    ctx.clearRect(0, 0, LOGIC_W, LOGIC_H);

    // 背景
    if(RES.bg) ctx.drawImage(RES.bg, 0, 0, LOGIC_W, LOGIC_H);

    // 顶部积分 HUD
    drawScoreHud(ctx);

    // 爱心
    for(const h of game.hearts){
      var img;
      if(h.type === 'red'){ img = RES.hr; }
      else if(h.type === 'yellow'){ img = RES.hy; }
      else if(h.type === 'ring'){ img = RES.ring; }
      else if(h.type === 'letter'){ img = RES.letter; }
      if(!img) continue;
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rot);
      var hw2 = h.hw || h.r, hh2 = h.hh || h.r;
      ctx.drawImage(img, -hw2, -hh2, hw2 * 2, hh2 * 2);
      ctx.restore();
    }
  }

  function render(){
    const ctx = game.ctx;
    ctx.clearRect(0, 0, LOGIC_W, LOGIC_H);

    // 背景
    if(RES.bg) ctx.drawImage(RES.bg, 0, 0, LOGIC_W, LOGIC_H);

    // 顶部积分 HUD
    drawScoreHud(ctx);

    // 爱心 / 戒指 / 请帖
    for(const h of game.hearts){
      var img;
      if(h.type === 'red'){ img = RES.hr; }
      else if(h.type === 'yellow'){ img = RES.hy; }
      else if(h.type === 'ring'){ img = RES.ring; }
      else if(h.type === 'letter'){ img = RES.letter; }
      if(!img) continue;
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rot);
      var hw2 = h.hw || h.r, hh2 = h.hh || h.r;
      ctx.drawImage(img, -hw2, -hh2, hw2 * 2, hh2 * 2);
      ctx.restore();
    }

    // 角色：走哪边竹篮朝哪边
    // 新郎素材篮子=画面右侧(向右走不镜像，向左走镜像)；新娘篮子=画面左侧(反之)
    if(char){
      const bobY = Math.sin(game.bob) * (game.moving ? 6 : 2);
      const breathe = 1 + Math.sin(game.bob * 0.8) * 0.02;
      const w = CHAR_W * breathe, h = CHAR_H * breathe;
      const dy = GROUND_Y - h + bobY;
      const sx = (game.frameIdx % SHEET_COLS) * CELL_W;
      const sy = Math.floor(game.frameIdx / SHEET_COLS) * CELL_H;
      const isBride = (char.sheet === RES.bride);
      const needFlip = isBride ? (game.charDir > 0) : (game.charDir < 0);
      ctx.save();
      ctx.shadowColor = "rgba(255,240,245,0.6)";
      ctx.shadowBlur = 10;
      if(needFlip){
        ctx.translate(game.charX, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(char.sheet, sx, sy, CELL_W, CELL_H, -w / 2, dy, w, h);
      } else {
        ctx.drawImage(char.sheet, sx, sy, CELL_W, CELL_H, game.charX - w / 2, dy, w, h);
      }
      ctx.restore();
    }
  }

  function drawScoreHud(ctx){
    var w, h, x, y, bgColor, scoreColor;
    var isNegScore = game.score < 0;
    w = 280; h = 78; x = LOGIC_W/2 - w/2; y = 60;
    bgColor = isNegScore ? "rgba(80,0,0,0.9)" : (game.score > 0 ? "rgba(192,8,30,0.85)" : "rgba(50,50,50,0.85)");
    scoreColor = isNegScore ? "#FF4444" : (game.score >= 50 ? "#00FF88" : "#FFE680");
    ctx.save();
    ctx.fillStyle = bgColor;
    roundRect(ctx, x, y, w, h, 18);
    ctx.fill();
    ctx.fillStyle = scoreColor;
    ctx.font = "bold 36px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    var scoreText = game.score + " 分";
    if(game.score >= 50){ scoreText += " 🔥"; }
    ctx.fillText(scoreText, LOGIC_W/2, y + h/2);
    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  // ===== 游戏结束弹层 =====

  var FAKE_LB = [
    {name:"林志远",score:6850},{name:"王诗晴",score:3520},{name:"张浩然",score:2890},

  ];
  var LB_TOKEN = (["github_pat_11CMWBH2A0kDm","judpMod1m_RPF3Zhm4PXL7nS","4N6TwWUXPSusqaiWAXwl8mLx","yMi9ZZLDYI4YAfVI4oA8h"].join(""));
  
function maskName(n){if(!n||n.length<=1)return n||"";var a=[];for(var i=1;i<n.length;i++)a.push("*");return n[0]+a.join("");}
function submitScore(name, score){
    var x = new XMLHttpRequest();
    x.open("POST","https://api.github.com/repos/guanqicong/guanqicong.github.io/issues",true);
    x.setRequestHeader("Accept","application/vnd.github+json");
    x.setRequestHeader("Authorization","Bearer "+LB_TOKEN);
    x.setRequestHeader("Content-Type","application/json");
    x.onload=function(){
      if(x.status===200||x.status===201){alert("上榜成功！");fetchLB();setTimeout(fetchLB,2000);}else{alert("上传失败("+x.status+")");}
    };
    x.onerror=function(){alert("网络错误");};
    x.send(JSON.stringify({title:"[LB] "+name+" "+score,body:"得分上榜："+name+" = "+score+" 分"}));
  }

function fetchLB(){
    var list = document.getElementById("lb-rows");
    if(!list) return;
    // 初始化为假数据
    var merged = FAKE_LB.slice();
    function doRender(){
      merged.sort(function(a,b){return b.score-a.score;});
      var top = merged.slice(0,10);
      var html = "";
      for(var k=0;k<top.length;k++){
        var row = top[k];
        var maskedName = maskName(row.name);
        var medal = k===0?"&#x1F947;":k===1?"&#x1F948;":k===2?"&#x1F949;":("<b>"+(k+1)+"</b>");
        var rowColor = k===0?"#FFD700":k===1?"#C0C0C0":k===2?"#CD7F32":"#fff";
        var bg = k%2===0?"rgba(255,255,255,.06)":"rgba(0,0,0,.15)";
        html += '<div style="display:flex;align-items:center;padding:8px 12px;border-radius:6px;margin-bottom:4px;background:'+bg+';">'
          + '<div style="width:50px;text-align:center;font-size:26px;">'+medal+'</div>'
          + '<div style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:'+rowColor+';font-size:24px;padding:0 8px;">'+maskedName+'</div>'
          + '<div style="width:110px;text-align:right;color:'+rowColor+';font-size:24px;font-weight:bold;">'+row.score+'</div>'
        + '</div>';
      }
      if(html) list.innerHTML = html;
    }
    doRender();
    // 从 GitHub 追加真实数据
    try {
      var xhr = new XMLHttpRequest();
      xhr.open("GET","https://api.github.com/repos/guanqicong/guanqicong.github.io/issues?state=open&per_page=100",true);
      xhr.setRequestHeader("Accept","application/vnd.github+json");
      xhr.onload = function(){
        if(xhr.status!==200) return;
        try {
          var issues = JSON.parse(xhr.responseText);
          for(var i=0;i<issues.length;i++){
            var m = issues[i].title.match(/\[LB\]\s*(.+?)\s+(-?\d+)/);
            if(!m) continue;
            var name = maskName(m[1]);
            var score = parseInt(m[2]);
            // 如果同名人已存在且分数更高则替换，否则追加
            var exists = false;
            for(var j=0;j<merged.length;j++){
              if(merged[j].name === name && merged[j].score >= score){ exists = true; break; }
            }
            if(!exists){
              // 移除同名低分
              for(var j=merged.length-1;j>=0;j--){
                if(merged[j].name === name) merged.splice(j,1);
              }
              merged.push({name:name, score:score});
            }
          }
          doRender();
        } catch(e){}
      };
      xhr.send();
    } catch(e){}
  }

    render(data);
    try {

      x.open("GET","https://api.github.com/repos/guanqicong/guanqicong.github.io/issues?state=open&per_page=100",true);
      x.setRequestHeader("Accept","application/vnd.github+json");
          x.onload = function(){

          var issues = JSON.parse(x.responseText);

            modalMerged.push({name:name, score:score});

function escapeHtml(s){
    return String(s).replace(/[<>&"']/g, function(c){
      return { "<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  // 超时兜底：15 秒后无论图片是否加载完都进游戏
  setTimeout(()=>{ if(document.getElementById("loading").style.display !== "none"){ setTip("网络较慢，进入中…"); finishLoading(); } }, 15000);

  init().catch(err=>{
    console.error(err);
    finishLoading(); // 任何异常都先放行，不卡死在转圈
  });
