<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#8e1f1f" />
<title>婚礼爱心大作战</title>
<style>
/* ══ 基础重置 ══════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  -webkit-user-select:none;user-select:none;}
button{font-family:inherit;}

/* ══ 舞台 720×1280，按视口等比缩放 ════════════════════ */
#stage{
  position:fixed;left:50%;top:50%;
  width:720px;height:1280px;
  transform:translate(-50%,-50%) scale(1);
  transform-origin:center center;
  background:#000;
}
.screen{position:absolute;left:0;top:0;width:100%;height:100%;display:none;overflow:hidden;}
.screen.active{display:block;}
.screen video{width:100%;height:100%;object-fit:cover;display:block;background:#000;}
/* 视频兜底静态画面：微信拦自动播放时显示婚礼画面（不黑屏），视频一播立即淡出 */
.vid-poster{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:3;opacity:1;transition:opacity .4s;pointer-events:none;}
/* 登记页（原感谢页） */
#thanks{background:linear-gradient(160deg,#a3241b 0%,#c9342a 45%,#e8b06a 100%);}
.reg-card{position:absolute;left:7%;right:7%;top:9%;z-index:5;background:rgba(255,255,255,.97);border-radius:22px;padding:30px 22px;text-align:center;box-shadow:0 12px 40px rgba(60,10,10,.45);}
.reg-logo{font-size:42px;}
.reg-title{font-size:24px;color:#a3241b;font-weight:800;letter-spacing:3px;margin:6px 0 4px;}
.reg-sub{font-size:13px;color:#8a4a28;margin-bottom:18px;}
#regName{width:100%;height:50px;border:2px solid #e8b06a;border-radius:14px;background:#fffaf3;padding:0 14px;font-size:17px;color:#4a2010;outline:none;text-align:center;box-sizing:border-box;}
#regName:focus{border-color:#c9342a;}
.reg-numrow{display:flex;align-items:center;justify-content:center;gap:20px;margin:16px 0;}
.reg-btn{width:50px;height:50px;border:none;border-radius:14px;background:linear-gradient(180deg,#e94f37,#c9342a);color:#fff;font-size:26px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #8e1f1f;}
.reg-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8e1f1f;}
#regNum{font-size:30px;font-weight:800;color:#a3241b;min-width:52px;}
.reg-submit{width:100%;height:54px;border:none;border-radius:16px;background:linear-gradient(180deg,#f2a03d,#e07a1f);color:#fff;font-size:19px;font-weight:800;letter-spacing:4px;cursor:pointer;box-shadow:0 4px 0 #a85a10;}
.reg-submit:active{transform:translateY(2px);box-shadow:0 2px 0 #a85a10;}
.reg-submit:disabled{opacity:.6;}
.reg-msg{min-height:20px;font-size:14px;font-weight:700;color:#1d7a3a;margin-top:10px;}
.reg-msg.err{color:#c9342a;}

/* ══ 透明点击按钮（位置严格按需求文档） ════════════════ */
.win-btn{position:absolute;border:none;background:transparent;padding:0;margin:0;cursor:pointer;z-index:10;touch-action:manipulation;}
#startHint{
  position:absolute;left:0;right:0;top:46%;text-align:center;z-index:20;
  color:#ffd700;font-size:22px;font-weight:700;letter-spacing:4px;
  text-shadow:0 2px 10px rgba(0,0,0,.7);
  animation:ldbeat 1.4s ease-in-out infinite;
  transition:opacity .5s;pointer-events:none;
}
#startArea{top:88%;height:8%;left:29%;right:29%;}
#groomBtn{top:81%;height:13%;left:3%;width:40%;}
#brideBtn{top:81%;height:13%;left:53%;width:40%;}
#rulesBtn{left:25%;right:25%;bottom:5%;height:18%;}
#mapArea{left:14%;width:72%;top:50%;height:26%;}
#joinBtn{left:32%;width:36%;top:86%;height:12%;}

/* ══ 游戏画布 ══════════════════════════════════════════ */
#game{background:#000;}
#gameCanvas{width:100%;height:100%;display:none;background:transparent;touch-action:none;}
#gameCanvas.active{display:block;}

/* ══ 弹层（fixed，z-index:200） ════════════════════════ */
.overlay{position:fixed;left:0;top:0;right:0;bottom:0;z-index:200;
  display:none;align-items:center;justify-content:center;
  background:rgba(40,10,10,.62);}
.overlay.show{display:flex;}
.panel{
  width:86%;max-width:560px;max-height:92vh;overflow-y:auto;
  background:linear-gradient(180deg,#fff6ec 0%,#ffe6cf 60%,#ffd9b8 100%);
  border:3px solid #e8b06a;border-radius:20px;
  padding:24px 20px 20px;text-align:center;color:#6e2b12;
  box-shadow:0 8px 40px rgba(0,0,0,.45);
}
.panel-title{font-size:30px;font-weight:800;color:#a3241b;letter-spacing:2px;margin-bottom:6px;}
.panel-reason{font-size:15px;color:#8a4a28;margin-bottom:10px;line-height:1.5;}
.score-row{font-size:20px;color:#6e2b12;margin:6px 0 12px;}
.score-row span{font-size:34px;font-weight:800;color:#d4380d;font-style:italic;}
.upload-row{display:flex;gap:8px;justify-content:center;align-items:center;margin:10px 0 14px;}
#nameInput{
  flex:1;max-width:230px;height:42px;border:2px solid #e8b06a;border-radius:10px;
  background:#fff;padding:0 12px;font-size:16px;color:#4a2010;outline:none;
}
.gold-btn,.main-btn{
  height:42px;border:none;border-radius:10px;cursor:pointer;touch-action:manipulation;
  font-size:16px;font-weight:700;color:#fff;
  background:linear-gradient(180deg,#e94f37,#c9342a);
  box-shadow:0 3px 0 #8e1f1f;
  padding:0 16px;white-space:nowrap;
}
.gold-btn:active,.main-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8e1f1f;}
.gold-btn:disabled{opacity:.55;}
.btn-lg{min-width:150px;height:54px;font-size:20px;padding:0 28px;border-radius:14px;}

/* 排行榜 */
.lb-mini{margin:6px 0 14px;border-top:1px dashed #e8b06a;padding-top:10px;}
.lb-mini-title{font-size:16px;font-weight:700;color:#a3241b;margin-bottom:8px;}
.lb-list{text-align:left;}
.lb-row{display:flex;align-items:center;padding:5px 8px;font-size:15px;border-radius:8px;}
.lb-row:nth-child(odd){background:rgba(232,176,106,.18);}
.lb-rank{width:34px;text-align:center;font-weight:700;color:#a3241b;}
.lb-name{flex:1;color:#6e2b12;}
.lb-score{color:#d4380d;font-weight:700;}
.lb-empty{text-align:center;color:#8a4a28;padding:10px 0;font-size:14px;}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

/* 提示 toast */
#toast{
  position:fixed;left:50%;top:18%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.78);color:#ffd700;
  padding:10px 20px;border-radius:10px;font-size:15px;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:300;
  max-width:80vw;text-align:center;
}
#toast.show{opacity:1;}

/* ══ 加载页（全部素材就绪后才进入游戏） ═══════════════ */
#loading{position:fixed;left:0;top:0;width:100%;height:100%;z-index:250;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,#a02416 0%,#7c1410 55%,#5c0f0c 100%);transition:opacity .5s;}
#loading.hide{opacity:0;pointer-events:none;}
.ld-box{width:76%;max-width:430px;text-align:center;color:#ffd9a0;}
.ld-heart{font-size:44px;line-height:1;margin-bottom:14px;animation:ldbeat 1s ease-in-out infinite;}
@keyframes ldbeat{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
.ld-title{font-size:30px;font-weight:700;color:#ffd700;letter-spacing:6px;margin-bottom:10px;
  text-shadow:0 0 16px rgba(255,215,0,.45);}
.ld-sub{font-size:15px;color:#e8b06a;margin-bottom:26px;letter-spacing:2px;}
.ld-bar{height:12px;background:rgba(255,255,255,.16);border-radius:8px;overflow:hidden;}
#ldFill{height:100%;width:0%;background:linear-gradient(90deg,#ffd700,#ff8c42);border-radius:8px;transition:width .3s;}
.ld-pct{margin-top:12px;font-size:17px;color:#ffd700;font-weight:600;}
.ld-tip{margin-top:20px;font-size:12px;color:rgba(255,217,160,.55);letter-spacing:1px;}
</style>
</head>
<body>

<!-- 加载页：全部图片/视频/音频就绪后才进入游戏 -->
<div id="loading">
  <div class="ld-box">
    <div class="ld-heart">💍</div>
    <div class="ld-title">婚礼接爱心</div>
    <div class="ld-sub">正在筹备婚礼现场，请稍候…</div>
    <div class="ld-bar"><div id="ldFill"></div></div>
    <div class="ld-pct" id="ldPct">0%</div>
    <div class="ld-tip">素材加载中，首次进入约需几秒</div>
  </div>
</div>

<div id="stage">
  <!-- 1. 开始页 -->
  <div id="start" class="screen active">
    <img id="pStart" class="vid-poster" alt="" />
    <video id="vStart" preload="auto" loop muted playsinline webkit-playsinline
      x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false"
      ></video>
    <button id="startArea" class="win-btn" aria-label="开始游戏"></button>
    <div id="startHint">👆 轻触屏幕 · 开始游戏</div>
  </div>

  <!-- 2. 角色选择页 -->
  <div id="select" class="screen">
    <video id="vSelect" preload="auto" loop muted playsinline webkit-playsinline
      x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false"
      ></video>
    <button id="groomBtn" class="win-btn" aria-label="男方亲友"></button>
    <button id="brideBtn" class="win-btn" aria-label="女方亲友"></button>
  </div>

  <!-- 3. 规则视频页 -->
  <div id="rules" class="screen">
    <video id="vRules" preload="auto" muted playsinline webkit-playsinline
      x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false"
      ></video>
    <button id="rulesBtn" class="win-btn" aria-label="开始接爱心"></button>
  </div>

  <!-- 4. 游戏页 -->
  <div id="game" class="screen">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- 5. 地图页 -->
  <div id="map" class="screen">
    <video id="vMap" preload="auto" loop muted playsinline webkit-playsinline
      x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false"
      ></video>
    <button id="mapArea" class="win-btn" aria-label="查看地图"></button>
    <button id="joinBtn" class="win-btn" aria-label="参加婚礼"></button>
  </div>

  <!-- 6. 登记页（原感谢页：不再用感谢视频素材，改为婚礼宾客登记） -->
  <div id="thanks" class="screen">
    <div class="reg-card">
      <div class="reg-logo">💌</div>
      <div class="reg-title">宾客登记</div>
      <div class="reg-sub">填写信息，让我们提前知道您要来！</div>
      <input id="regName" type="text" maxlength="12" placeholder="您的姓名（如：张三）" autocomplete="off" />
      <div class="reg-numrow">
        <button id="regMinus" class="reg-btn" aria-label="减少">−</button>
        <span id="regNum">2</span>
        <button id="regPlus" class="reg-btn" aria-label="增加">+</button>
      </div>
      <button id="regSubmit" class="reg-submit">提交登记</button>
      <div id="regMsg" class="reg-msg"></div>
    </div>
  </div>
</div>

<!-- 游戏结束弹层（body 级，fixed z-index:200） -->
<div id="gameOverLayer" class="overlay">
  <div class="panel">
    <div id="goTitle" class="panel-title">游戏结束</div>
    <div id="goReason" class="panel-reason"></div>
    <div class="score-row">最终得分 <span id="goScore">0</span></div>
    <div class="upload-row">
      <input id="nameInput" type="text" maxlength="12" placeholder="输入你的名字" />
      <button id="uploadBtn" class="gold-btn">上传分数</button>
    </div>
    <div class="lb-mini">
      <div class="lb-mini-title">🏆 排行榜 TOP10</div>
      <div id="lbMiniList" class="lb-list"></div>
    </div>
    <div class="btn-row">
      <button id="joinWedBtn" class="main-btn btn-lg">参与婚礼</button>
      <button id="againBtn" class="main-btn btn-lg">再玩一次</button>
    </div>
  </div>
</div>

<!-- 排行榜弹层 -->
<div id="lbModal" class="overlay">
  <div class="panel">
    <div class="panel-title">🏆 排行榜</div>
    <div id="lbFullList" class="lb-list" style="margin:14px 0;"></div>
    <button id="lbCloseBtn" class="main-btn">关闭</button>
  </div>
</div>

<!-- 提示 toast -->
<div id="toast"></div>

<!-- 音频 -->
<audio id="aBgm" loop preload="none"></audio>
<audio id="aBtn" preload="none"></audio>
<audio id="aCatch" preload="none"></audio>

<script>
(function(){
'use strict';

/* ══ 常量 ══════════════════════════════════════════════ */
var LOGIC_W = 720, LOGIC_H = 1280;   // 逻辑画布尺寸
var SPR_W = 173, SPR_H = 240;        // 精灵图帧尺寸（压缩版：10 帧×173、单行 240 高）
var SPR_SCALE = 1.037;               // 角色绘制倍率（173×1.037≈179.4，保持原绘制尺寸）
var DRAW_W = SPR_W * SPR_SCALE;      // 角色绘制宽度 ~179
var DRAW_H = SPR_H * SPR_SCALE;      // 角色绘制高度 ~249
var FEET_SRC_Y = 230;                // 角色脚底在源帧内的 Y（脚踩地面用）
var GROUND_Y = 1170;                 // 角色脚底 Y（逻辑坐标）
var CHAR_CENTER_Y = GROUND_Y - (FEET_SRC_Y - 20) * SPR_SCALE / 2;  // 角色视觉中心 Y（用于碰撞检测）
var TS = '20260926';                 // 缓存时间戳，改版时更新此值即可

/* ══ 素材 URL（全部带时间戳防缓存） ════════════════════ */
var U = {
  bg:     'assets/img_0_hd.jpg',
  pstart: 'assets/poster_start.jpg',
  groom:  'assets/groom.webp',
  bride:  'assets/bride.webp',
  hr:     'assets/img_1_hd.webp',
  hy:     'assets/img_2_hd.webp',
  ring:   'assets/ring_hd.webp',
  letter: 'assets/letter_hd.webp',
  bgm:    'assets/bgm_v2.mp3',
  btn:    'assets/btn.mp3',
  cat:    'assets/catch.mp3'
};
var VIDS = {
  vStart:  'assets/start_v2.mp4',
  vSelect: 'assets/select_v2.mp4',
  vRules:  'assets/rules.mp4',
  vMap:    'assets/map_v2.mp4',
};
var NEXT = { start:'vSelect', select:'vRules', rules:'vMap', map:'', thanks:'vStart' };
function q(u){ return u + '?t=' + TS; }

/* ══ 游戏状态 ═══════════════════════════════════════════ */
var G = {
  canvas:null, ctx:null, running:false,
  _raf:null, lastT:0,
  score:0, hearts:[],
  charX:360, charDir:1, moving:false,
  bob:0, frame:0, ftimer:0, spawnT:0.3
};
var charImg = null;   // 当前角色 Image
var RES = {};         // 游戏用图片资源

/* ══ 排行榜（GitHub Issues API） ════════════════════════ */
var LBTOK = [
  'github_pat_11CMWBH2A0k',
  'DmjudpMod1m_RPF3Zhm',
  '4PXL7nS4N6TwWUXPS',
  'usqaiWAXwl8mLxyMi',
  '9ZZLDYI4YAfVI4oA',
  '8h'
].join('');
var API = 'https://api.github.com/repos/guanqicong/guanqicong.github.io/issues';
var FAKE = [
  {name:'王浩然',score:8160},{name:'李思彤',score:6380},{name:'张明轩',score:6120},
  {name:'刘欣怡',score:5890},{name:'陈子豪',score:5560},{name:'杨雨桐',score:5230},
  {name:'赵嘉诚',score:4970},{name:'孙雅静',score:4680},{name:'周俊杰',score:4420},
  {name:'吴晓萱',score:4150}
];

/* ══ DOM 快捷引用 ═══════════════════════════════════════ */
var $ = function(id){ return document.getElementById(id); };
var aBgm=$('aBgm'), aBtn=$('aBtn'), aCatch=$('aCatch');

/* ══ 音频 ═══════════════════════════════════════════════ */
function playBtn(){
  try{ if(!aBtn.src) aBtn.src=q(U.btn); aBtn.currentTime=0; aBtn.play().catch(function(){}); }catch(e){}
}
function playCatch(){
  try{ if(!aCatch.src) aCatch.src=q(U.cat); aCatch.currentTime=0; aCatch.play().catch(function(){}); }catch(e){}
}
function playBgm(){
  try{
    if(aBgm.src && !aBgm.paused) return;   // 已在播 → 不打断重播
    if(!aBgm.src) aBgm.src=q(U.bgm);
    aBgm.currentTime=0; aBgm.play().catch(function(){});
  }catch(e){}
}
function stopBgm(){ try{ aBgm.pause(); }catch(e){} }

/* ══ 舞台缩放（720×1280 等比适配视口） ═════════════════ */
function fitStage(){
  var stage=$('stage');
  var s=Math.min(window.innerWidth/LOGIC_W, window.innerHeight/LOGIC_H);
  stage.style.transform='translate(-50%,-50%) scale('+s+')';
}

/* ══ 视频管理：只播当前屏，后台静默预载下一个 ══════════ */
function pauseAll(){
  Object.keys(VIDS).forEach(function(id){
    var v=$(id); if(v) v.pause();
  });
}
function playOne(id, src){
  var v=$(id); if(!v) return;
  var full=q(src);
  if(v.getAttribute('data-src')!==full){
    v.src=full; v.setAttribute('data-src',full); v.load();
  }
  v.muted=true;
  v.preload='auto';                    // 播放时自动缓冲，避免先卡海报
  v.loop = (id!=='vRules');           // 规则视频不循环，播完停最后一帧
  if(v.ended) v.currentTime=0;
  // 开始页：显示静态兜底画面+轻触提示；视频一播放立即淡出（微信拦自动播放时不黑屏）
  if(id==='vStart'){
    var hint=$('startHint');
    var pimg=$('pStart');
    var hideCover=function(){ if(pimg) pimg.style.opacity='0'; if(hint) hint.style.opacity='0'; };
    if(pimg) pimg.style.opacity='1';
    if(hint) hint.style.opacity='1';
    setTimeout(function(){ if(v.paused){ try{ v.currentTime=0.01; }catch(e){} tryPlay(); } }, 120);
  }
  var tryPlay=function(){
    if(v.paused){
      var pp=v.play();
      if(pp && pp.then) pp.then(function(){ if(id==='vStart') hideCover(); }).catch(function(){});
    }
  };
  var p=v.play();
  if(p && p.then) p.then(function(){ if(id==='vStart') hideCover(); }).catch(function(){ tryPlay(); });
  // 首帧未就绪时 play() 可能一直挂起（pending）不 reject → 必须主动等 loadeddata 再补播
  if(v.readyState<2) v.addEventListener('loadeddata', tryPlay, {once:true});
}
function preloadNext(screen){
  var id=NEXT[screen]; if(!id) return;
  var v=$(id);
  if(v && !v.getAttribute('data-src')){
    v.src=q(VIDS[id]); v.setAttribute('data-src',q(VIDS[id]));
    v.preload='auto';                    // 后台完整缓冲下一个视频，切换时秒播不卡海报
    v.load();                            // 静默 load，不自动播放
  }
}

/* ══ 屏幕切换 ════════════════════════════════════════════ */
function showScreen(name){
  // 1. 停游戏循环
  if(G._raf){ cancelAnimationFrame(G._raf); G._raf=null; }
  G.running=false;
  // 2. 隐藏 canvas（防止白底盖住画面）
  var gc=$('gameCanvas');
  if(gc){ gc.style.display='none'; gc.classList.remove('active'); }
  if(G.ctx) G.ctx.clearRect(0,0,LOGIC_W,LOGIC_H);
  // 3. 切换 .screen
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  $(name).classList.add('active');
  // 4. 停所有视频，播当前屏（背景音乐不打断，从开始页一直播）
  pauseAll();
  if(name==='start')  playOne('vStart',  VIDS.vStart);
  if(name==='select') playOne('vSelect', VIDS.vSelect);
  if(name==='rules')  playOne('vRules',  VIDS.vRules);
  if(name==='map')    playOne('vMap',    VIDS.vMap);   // 地图页：播专属单场景循环视频（map_v2.mp4 已裁剪为纯地图画面）
  if(name==='thanks') regInit();
  preloadNext(name);                     // 后台静默 load 下一个视频
  // 5. 游戏屏
  if(name==='game'){
    gc.style.display='block'; gc.classList.add('active');
    startGame();
  }
}

/* ══ 全资源加载：事件驱动 + 定时轮询双保险，最迟 12 秒必进 ═══ */
var LOAD_TOTAL=0, LOAD_DONE=0;
function loadAssets(onProgress, onDone){
  var imgs={bg:U.bg, pstart:U.pstart, hr:U.hr, hy:U.hy, ring:U.ring, letter:U.letter, groom:U.groom, bride:U.bride};
  var vidIds=Object.keys(VIDS);               // start→select→rules→map→thanks
  var auds=[['bgm','aBgm',U.bgm],['btn','aBtn',U.btn],['cat','aCatch',U.cat]];
  var total=Object.keys(imgs).length + vidIds.length + auds.length;
  var done=0;
  function tick(){
    done++;
    if(typeof onProgress==='function') onProgress(done, total);
    if(done>=total && typeof onDone==='function') onDone();
  }
  function once(fn){ var d=false; return function(){ if(d) return; d=true; fn(); }; }
  var itemDone={};   // 每个资源按 key 标记，防止重复计数
  function mark(key){
    if(itemDone[key]) return;
    itemDone[key]=true; tick();
  }
  // ① 图片：并行加载（小文件，快）；complete 即算就绪（成功/失败都不阻塞）
  Object.keys(imgs).forEach(function(k){
    var im=new Image();
    im.onload=function(){ mark('img:'+k); };
    im.onerror=function(){ mark('img:'+k); };
    im.src=q(imgs[k]);
    if(k==='bg') RES.bg=im;
    else if(k==='hr') RES.hr=im;
    else if(k==='hy') RES.hy=im;
    else if(k==='ring') RES.ring=im;
    else if(k==='letter') RES.letter=im;
    else if(k==='groom'){ charImg=im; }
  });
  // ② 音频：并行加载；能播（readyState>=2）即算就绪
  auds.forEach(function(a){
    var el=$(a[1]);
    if(!el){ mark('aud:'+a[0]); return; }
    el.preload='auto';
    var full=q(a[2]);
    if(el.getAttribute('data-src')!==full){ el.src=full; el.setAttribute('data-src',full); }
    var ok=once(function(){ mark('aud:'+a[0]); });
    el.addEventListener('canplay', ok);
    if(el.readyState>=2) ok();
    el.load();
    setTimeout(ok, 6000);   // 6 秒兜底
  });
  // ③ 视频：并行加载；首帧就绪（loadeddata）即算就绪
  vidIds.forEach(function(id){
    var v=$(id);
    if(!v){ mark('vid:'+id); return; }
    v.preload='auto';
    var full=q(VIDS[id]);
    if(v.getAttribute('data-src')!==full){ v.src=full; v.setAttribute('data-src',full); }
    var ok=once(function(){ mark('vid:'+id); });
    v.addEventListener('loadeddata', ok);
    v.addEventListener('error', ok);
    if(v.readyState>=2) ok();
    v.load();
    setTimeout(ok, 6000);   // 6 秒兜底
  });
  // ④ 轮询兜底：250ms 检查一次就绪状态（事件没触发也能发现），整体 8 秒强制进入
  var started=Date.now();
  (function poll(){
    if(done>=total || Date.now()-started >= 8000){
      while(done<total) tick();   // 到点强制收尾（剩余资源进入游戏后自动续缓冲）
      return;
    }
    setTimeout(poll, 250);
  })();
}
function updateLoadPct(done, total){
  var pct=total ? Math.min(100, Math.round(done/total*100)) : 0;
  var f=$('ldFill'); if(f) f.style.width=pct+'%';
  var p=$('ldPct');  if(p) p.textContent=pct+'%';
}
/* 规则视频播完停回首帧：下次进入直接从头播，无需 seek */
var rv=$('vRules');
if(rv) rv.addEventListener('ended', function(){ try{ rv.currentTime=0; }catch(e){} });
var isBride = false;   // 新娘素材本身是横向镜像，翻转条件需反转
function chooseChar(role){
  isBride = (role !== 'groom');
  charImg = new Image();
  charImg.src = q(role==='groom' ? U.groom : U.bride);

}

/* ══ 游戏启动 / 画布尺寸 ═════════════════════════════════ */
var BG_CANVAS=null;    // 背景离屏画布（预渲染一次，每帧直接贴，省去逐帧缩放大图）
var SPR_CACHE={};      // 掉落物预切图（按类型缓存）
var FRAME_CACHE=null;  // 角色 10 帧预切图
function buildBgCanvas(){
  if(!RES.bg || !RES.bg.complete) return null;
  var c=document.createElement('canvas');
  c.width=LOGIC_W; c.height=LOGIC_H;
  var x=c.getContext('2d');
  x.imageSmoothingEnabled=true;
  x.drawImage(RES.bg, 0, 0, LOGIC_W, LOGIC_H);
  return c;
}
function getSpr(type){
  if(SPR_CACHE[type]) return SPR_CACHE[type];
  var img = type==='red' ? RES.hr : type==='yellow' ? RES.hy : type==='ring' ? RES.ring : RES.letter;
  if(!img || !img.complete) return null;
  var hw=(type==='letter'?122:(type==='ring'?58:52)), hh=(type==='letter'?69:(type==='ring'?58:52));
  var c=document.createElement('canvas'); c.width=hw*2; c.height=hh*2;
  var x=c.getContext('2d'); x.imageSmoothingEnabled=true;
  x.drawImage(img, 0, 0, hw*2, hh*2);
  SPR_CACHE[type]=c; return c;
}
function getCharFrames(){
  if(FRAME_CACHE) return FRAME_CACHE;
  if(!charImg || !charImg.complete) return null;
  FRAME_CACHE=[];
  for(var f=0; f<10; f++){
    var c=document.createElement('canvas'); c.width=DRAW_W; c.height=DRAW_H;
    var x=c.getContext('2d'); x.imageSmoothingEnabled=true;
    x.drawImage(charImg, f*SPR_W, 0, SPR_W, SPR_H, 0, 0, DRAW_W, DRAW_H);
    FRAME_CACHE.push(c);
  }
  return FRAME_CACHE;
}
function sizeCanvas(){
  var c=$('gameCanvas');
  var rect=c.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1, 1.5);   // 渲染分辨率上限 1.5 倍，移动端大幅减负（画质几乎无感）
  c.width =Math.max(1, Math.round(rect.width*dpr));
  c.height=Math.max(1, Math.round(rect.height*dpr));
  G.canvas=c;
  G.ctx=c.getContext('2d');
  G.ctx.setTransform(c.width/LOGIC_W, 0, 0, c.height/LOGIC_H, 0, 0);
  BG_CANVAS=buildBgCanvas();   // 背景预渲染一次
}
function startGame(){
  sizeCanvas();
  G.score=0; G.hearts=[];
  G.charX=LOGIC_W/2; G.charDir=1; G.moving=false;
  G.bob=0; G.frame=0; G.ftimer=0; G.spawnT=0.3;
  G.lastT=0; G.running=true;
  G.targetX=LOGIC_W/2;
  playBgm();
  if(G._raf) cancelAnimationFrame(G._raf);
  G._raf=requestAnimationFrame(loop);
}

/* ══ 输入：按下/拖动都只更新目标点，角色以匀速线性追过去（跟手但不瞬移），松手即停 ══ */
var MOVE_SPEED = 800;      // 角色线性追目标的速度（逻辑像素/秒），跟手且平滑
function clampX(x){ return Math.max(DRAW_W/2, Math.min(LOGIC_W-DRAW_W/2, x)); }
function pointerToCharX(clientX){
  var rect=G.canvas.getBoundingClientRect();
  var x=(clientX-rect.left)/rect.width*LOGIC_W;
  return clampX(x);
}
function bindInput(){
  var gameEl=$('game');
  var lastTouchT=0;
  function onPress(clientX){           // 按下：目标=手指位置，角色匀速线性走过去（绝不瞬移）
    G.targetX = pointerToCharX(clientX);
    G.moving = true;
  }
  function onDrag(clientX){            // 拖动：目标持续跟随手指，角色始终匀速追（跟手、线性、不闪现）
    G.targetX = pointerToCharX(clientX);
    G.moving = true;
  }
  gameEl.addEventListener('touchstart',function(e){
    if(!G.running) return; e.preventDefault();
    lastTouchT=Date.now();
    onPress(e.touches[0].clientX);
  },{passive:false});
  gameEl.addEventListener('touchmove',function(e){
    if(!G.running) return; e.preventDefault();
    onDrag(e.touches[0].clientX);
  },{passive:false});
  gameEl.addEventListener('touchend',function(){ if(G.running) G.moving=false; });
  gameEl.addEventListener('touchcancel',function(){ if(G.running) G.moving=false; });
  gameEl.addEventListener('mousedown',function(e){
    if(!G.running) return;
    if(Date.now()-lastTouchT < 600) return;  // 触摸后的合成鼠标事件忽略，避免重复触发
    onPress(e.clientX);
  });
  window.addEventListener('mousemove',function(e){
    if(!G.running || !G.moving) return;
    onDrag(e.clientX);
  });
  window.addEventListener('mouseup',function(){ if(G.running) G.moving=false; });
}

/* ══ 掉落物 ═════════════════════════════════════════════ */
function spawnHeart(){
  var r=Math.random(), type, hw, hh, score, speed, r2;
  if(r < 0.48){ type='red';    hw=52; hh=52; score=10;  speed=240; r2=48; }   // 红心 48%（更多）
  else if(r < 0.70){ type='yellow'; hw=52; hh=52; score=-20; speed=420; r2=48; } // 黄心 22%
  else if(r < 0.78){ type='ring';   hw=58; hh=58; score=50;  speed=240; r2=52; } // 戒指 8%（放大 16%，碰撞同步放大）
  else {              type='letter'; hw=122;hh=69; score=0;   speed=420; r2=58; } // 请柬 22%
  if(G.hearts.length >= 60) return;   // 同屏掉落物上限，防止极端堆积拖慢渲染
  G.hearts.push({
    type:type, x:hw+Math.random()*(LOGIC_W-2*hw), y:-hh,
    hw:hw, hh:hh, speed:speed, r2:r2
  });
}
function checkCol(h){
  var dx = h.x - G.charX;
  var dy = h.y - CHAR_CENTER_Y;
  var rr = (DRAW_W/2 + h.r2);
  return (dx*dx + dy*dy) < (rr*rr);
}
function collide(h){
  if(h.type==='red'){ G.score+=10; playCatch(); }
  else if(h.type==='yellow'){ G.score-=20; playCatch(); }
  else if(h.type==='ring'){ G.score+=50; playCatch(); }
  else { doGameOver('letter'); return; }
  if(G.score < 0) doGameOver('negative');
}

/* ══ 更新 ═══════════════════════════════════════════════ */
function update(dt){
  // 移动：目标=手指位置，角色匀速线性追（跟手、不瞬移）
  var walking=false;
  if(G.moving){
    var dx=G.targetX - G.charX;
    if(Math.abs(dx) > 4){                        // 还没到目标 → 匀速走过去
      var step=Math.min(MOVE_SPEED*dt, Math.abs(dx));
      G.charX += (dx>0?1:-1)*step;
      G.charDir = (dx>0?1:-1);
      walking=true;
    }
  }
  // 走路动画：移动时播；停下后平滑归位站定
  if(walking){
    G.ftimer += dt;
    while(G.ftimer >= 0.12){ G.ftimer -= 0.12; G.frame=(G.frame+1)%10; }
    G.bob += dt*8;
  }else if(G.bob !== 0){
    var target=Math.round(G.bob/Math.PI)*Math.PI;   // 平滑归位，角色稳稳站地
    G.bob += (target-G.bob)*Math.min(1, dt*8);
  }
  // 生成
  G.spawnT -= dt;
  if(G.spawnT <= 0){ spawnHeart(); G.spawnT = 0.3 + Math.random()*0.4; }
  // 掉落 + 碰撞
  var mul = Math.pow(1.2, Math.floor(G.score/500));   // 每 500 分速度 ×1.2
  for(var i=G.hearts.length-1; i>=0; i--){
    var h=G.hearts[i];
    h.y += h.speed * mul * dt;
    if(h.y - h.hh > LOGIC_H){ G.hearts.splice(i,1); continue; }
    if(checkCol(h)){ collide(h); G.hearts.splice(i,1); }
  }
}

/* ══ 渲染（背景 → 掉落物 → 角色 → HUD） ═════════════════ */
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function render(){
  var ctx=G.ctx;
  // 背景：直接贴预渲染好的离屏画布（避免每帧从大图缩放）
  if(BG_CANVAS) ctx.drawImage(BG_CANVAS, 0, 0, LOGIC_W, LOGIC_H);
  else if(RES.bg && RES.bg.complete) ctx.drawImage(RES.bg, 0, 0, LOGIC_W, LOGIC_H);
  // 掉落物：使用预切小图
  ctx.imageSmoothingEnabled=false;
  G.hearts.forEach(function(h){
    var c=getSpr(h.type);
    if(c) ctx.drawImage(c, h.x-h.hw, h.y-h.hh);
  });
  // 角色：使用预切帧（源帧 345×480，脚底锚定 GROUND_Y）
  var frames=getCharFrames();
  if(frames){
    var dx = G.charX - DRAW_W/2;
    var dy = GROUND_Y - FEET_SRC_Y*SPR_SCALE + Math.sin(G.bob)*4;
    ctx.save();
    if((G.charDir < 0) !== isBride){  // 镜像翻转：新郎朝左时翻；新娘素材默认朝向相反，条件反转
      ctx.translate(G.charX*2,0); ctx.scale(-1,1);
    }
    ctx.drawImage(frames[G.frame], dx, dy);
    ctx.restore();
  }
  // HUD
  ctx.imageSmoothingEnabled=true;
  ctx.fillStyle='rgba(0,0,0,.5)';
  roundRect(ctx,12,12,180,54,12); ctx.fill();
  ctx.fillStyle='#FFD700';
  ctx.font='bold 36px sans-serif';
  ctx.textAlign='left';
  ctx.fillText('\u2764 '+G.score, 26, 52);
}

/* ══ 游戏循环（先调度再判断 running） ═══════════════════ */
function loop(now){
  G._raf = requestAnimationFrame(loop);
  if(!G.running) return;
  var dt = Math.min((now-G.lastT)/1000, 0.05);
  G.lastT = now;
  update(dt);
  render();
}

/* ══ 游戏结束 ═══════════════════════════════════════════ */
function doGameOver(reason){
  G.running=false;
  if(G._raf){ cancelAnimationFrame(G._raf); G._raf=null; }
  if(G.ctx) G.ctx.clearRect(0,0,LOGIC_W,LOGIC_H);
  var gc=$('gameCanvas');
  if(gc){ gc.style.display='none'; gc.classList.remove('active'); }
  stopBgm();
  showGameOver(reason);
}
function showGameOver(reason){

  $('goReason').textContent = (reason==='letter')

/* ══ 排行榜 ═════════════════════════════════════════════ */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function maskName(n){ return (n && n.length) ? (n.charAt(0)+'***') : '匿名'; }
function renderLB(list, cid){
  var el=$(cid); if(!el) return;
  if(!list || !list.length){ el.innerHTML='<div class="lb-empty">暂无上榜记录</div>'; return; }
  var medals=['🥇','🥈','🥉'];
  var html='';
  list.forEach(function(row,i){
    var medal=(i<3)?medals[i]:String(i+1);
    html+='<div class="lb-row"><span class="lb-rank">'+medal+'</span>'
        + '<span class="lb-name">'+esc(maskName(row.name))+'</span>'
        + '<span class="lb-score">'+esc(String(row.score))+' 分</span></div>';
  });
  el.innerHTML=html;
}
function loadLeaderboard(cid){
  fetch(API+'?state=all&per_page=100&page=1', {headers:{'Accept':'application/vnd.github+json'}})
  .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
  .then(function(list){
    if(!Array.isArray(list)) throw new Error('bad resp');
    var rows=[];
    list.forEach(function(issue){
      if(!issue || !issue.title) return;
      var m=/^\[LB\]\s*(.+?)\s+(\d+)\s*$/.exec(issue.title);
      if(!m) return;
      var nm=m[1].trim();
      if(!/[\u4e00-\u9fa5]/.test(nm)) return;   // 过滤乱码/非中文名条目（如 ??? 重复假数据），保证榜单真实不重复
      rows.push({name:nm, score:parseInt(m[2],10)});
    });
    rows.sort(function(a,b){ return b.score-a.score; });
    rows=rows.slice(0,10);
    renderLB(rows, cid);
  })
  .catch(function(){ renderLB(FAKE, cid); });   // 网络异常 → 本地假数据
}
function doUpload(name){
  var btn=$('uploadBtn');
  if(btn.disabled) return;              // 已上传过，跳过
  btn.disabled=true; btn.textContent='上传中...';
  fetch(API, {
    method:'POST',
    headers:{
      'Accept':'application/vnd.github+json',
      'Content-Type':'application/json',
      'Authorization':'Bearer '+LBTOK
    },
    body: JSON.stringify({
      title:'[LB] '+name+' '+G.score,
      body:'得分上榜：'+name+' = '+G.score+' 分'
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if(j && j.number){
      btn.disabled=true; btn.textContent='已上传';
      loadLeaderboard('lbMiniList');    // 实时刷新排行榜（先刷新，保证 toast 异常也不中断）
      loadLeaderboard('lbFullList');
      showToast('🎉 上传成功！');
    } else {
      btn.disabled=false; btn.textContent='上传分数';
      showToast('上传失败：'+(j&&j.message?j.message:'未知错误'));
    }
  })
  .catch(function(){
    btn.disabled=false; btn.textContent='上传分数';
    showToast('网络异常，上传失败，可稍后重试');
  });
}
function uploadScore(){
  var inp=$('nameInput');
  var name=inp.value.trim().replace(/[[\]<>]/g,'');
  if(!name){ showToast('请先输入名字'); inp.focus(); return; }
  if(name.length>12) name=name.slice(0,12);
  doUpload(name);
}

    fetch(API,{method:'POST',
      headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+LBTOK,'Content-Type':'application/json'},
      body:JSON.stringify({title:'宾客登记：'+name, body:'参加人数：'+regNum+'人\n提交时间：'+new Date().toLocaleString('zh-CN')})})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(){
      msg.textContent='✅ 登记成功！期待与您相见'; msg.className='reg-msg';
      $('regName').disabled=true; $('regName').value='';
      $('regPlus').style.display='none'; $('regMinus').style.display='none';
      btn.textContent='已登记 ✓';
    })
    .catch(function(){ btn.disabled=false; msg.textContent='提交失败，请检查网络后重试'; msg.className='reg-msg err'; });
  });
}

/* ══ 微信 X5 内核兼容 + 触摸解锁视频 ════════════════════ */
function wechatFix(){
  document.querySelectorAll('video').forEach(function(v){
    v.setAttribute('x5-playsinline','');
    v.setAttribute('x5-video-player-type','h5');
    v.setAttribute('x5-video-player-fullscreen','false');
    v.setAttribute('webkit-playsinline','');
    v.setAttribute('playsinline','');
    v.muted=true;
  });
  document.addEventListener('touchstart', function(){
    playBgm();   // 首次触摸 → 背景音乐从开始页就有（浏览器自动播放策略下的兜底）
    // 只播当前画面的视频（其余后台预载不播，避免多个视频同时出声）
    var cur=document.querySelector('.screen.active');
    var v=cur ? cur.querySelector('video') : null;
    if(v && v.getAttribute('data-src') && v.paused){
      var pp=v.play();
      if(pp && pp.then) pp.then(function(){
        var h=$('startHint'); if(h) h.style.opacity='0';
        var pi=$('pStart');  if(pi) pi.style.opacity='0';
      }).catch(function(){});
    }
  }, {passive:true});
}

/* ══ 初始化：先加载全部素材，就绪后进入开始页 ═══════ */
function init(){
  fitStage();
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', function(){ setTimeout(fitStage,200); });
  bindInput();
  bindButtons();
  wechatFix();
  var entered=false;
  function enter(){
    if(entered) return; entered=true;
    var l=$('loading'); if(l) l.classList.add('hide');
    setTimeout(function(){ if(l) l.style.display='none'; }, 600);
    var pimg=$('pStart'); if(pimg) pimg.src=q(U.pstart);   // 兜底静态画面（带缓存时间戳）
    showScreen('start');   // 进入即播开始页视频（未就绪时会自动补播，见 playOne）
    try{ setTimeout(function(){ playBgm(); }, 200); }catch(e){}   // 开始页就有音乐
  }
  // 全部素材就绪（loadAssets：事件+轮询双保险，最迟 12 秒进入）后进开始页
  loadAssets(function(done,total){
    updateLoadPct(done,total);
    if(done>=total) setTimeout(enter, 350);
  }, function(){});
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
